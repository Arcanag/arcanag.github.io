<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrap{% if page.wide %} wrap--home{% endif %}">
    {% include header.html %}
    <main id="main">
{{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="{{ '/js/main.js' | relative_url }}" defer></script>
  {%- for script in page.scripts %}
  <script src="{{ script | relative_url }}" defer></script>
  {%- endfor %}
</body>
</html>
