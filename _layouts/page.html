---
layout: default
---
<section class="hero{% if page.long %} hero--long{% endif %}">
  {%- if page.bg_word %}<div class="hero__ghost" aria-hidden="true">{{ page.bg_word }}</div>{% endif %}
  <div class="hero__inner">
    {%- if page.kicker %}<p class="label">{{ page.kicker }}</p>{% endif %}
    <h1 class="hero__title">{{ page.heading | default: page.title }}</h1>
    {%- if page.tagline %}<p class="hero__tagline">{{ page.tagline }}</p>{% endif %}
  </div>
</section>
{{ content }}
