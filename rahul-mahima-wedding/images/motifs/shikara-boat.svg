<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <!-- Shikara boat silhouette for Lake Journey theme -->
  <!-- Canopy frame -->
  <path d="M100 40 C100 20, 200 20, 200 40 L200 100 L100 100 Z"
        fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
  <!-- Canopy top ornament -->
  <path d="M150 15 L145 25 L155 25 Z" fill="#D4AF37" opacity="0.6"/>
  <!-- Canopy posts -->
  <line x1="105" y1="40" x2="105" y2="100" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
  <line x1="195" y1="40" x2="195" y2="100" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
  <!-- Canopy scallops -->
  <path d="M100 40 Q110 50 120 40 Q130 50 140 40 Q150 50 160 40 Q170 50 180 40 Q190 50 200 40"
        fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.7"/>
  <!-- Boat hull -->
  <path d="M60 120 C60 110, 80 100, 100 100 L200 100 C220 100, 240 110, 240 120 L230 140 C225 150, 75 150, 70 140 Z"
        fill="#D4AF37" opacity="0.15" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Boat prow -->
  <path d="M60 120 C50 115, 40 118, 30 110 C35 108, 45 112, 60 120"
        fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Boat stern ornament -->
  <path d="M240 120 C250 115, 255 110, 260 100 C258 105, 252 112, 240 120"
        fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Water reflection lines -->
  <line x1="80" y1="160" x2="130" y2="160" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>
  <line x1="150" y1="165" x2="220" y2="165" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>
  <line x1="100" y1="172" x2="180" y2="172" stroke="#D4AF37" stroke-width="0.5" opacity="0.15"/>
</svg>
