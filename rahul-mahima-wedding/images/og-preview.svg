<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background — warm sunset gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4B5"/>
      <stop offset="40%" stop-color="#FFD194"/>
      <stop offset="100%" stop-color="#FFC8A0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Maroon card in center -->
  <rect x="350" y="80" width="500" height="470" rx="12" fill="#9B1B30" stroke="#D4AF37" stroke-width="2"/>
  <rect x="365" y="95" width="470" height="440" rx="8" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Gold mandala circle -->
  <circle cx="600" cy="180" r="45" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.35"/>
  <circle cx="600" cy="180" r="30" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.25"/>
  <text x="600" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#D4AF37" opacity="0.7">R &amp; M</text>

  <!-- Together with their families -->
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#C9A84C" font-style="italic" opacity="0.8">Together with their families</text>

  <!-- Couple Names -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="600" fill="#D4AF37">Rahul</text>
  <text x="600" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#F0E0B0" font-style="italic">&amp;</text>
  <text x="600" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#D4AF37">Mahima</text>

  <!-- Divider -->
  <line x1="500" y1="440" x2="560" y2="440" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>
  <rect x="595" y="435" width="10" height="10" fill="#D4AF37" opacity="0.3" transform="rotate(45, 600, 440)"/>
  <line x1="640" y1="440" x2="700" y2="440" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>

  <!-- Save the Date -->
  <text x="600" y="475" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="5" fill="#F0E0B0" opacity="0.7">SAVE THE DATE</text>

  <!-- Date -->
  <text x="600" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#FAF6F0">8th &amp; 9th July, 2026</text>

  <!-- Udaipur -->
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#C9A84C" opacity="0.6">UDAIPUR, RAJASTHAN</text>
</svg>
