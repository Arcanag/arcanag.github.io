<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 742.625 450" style="max-width: 742.625px; background-color: transparent;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#f0ebe0;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#a44141;}#my-svg .error-text{fill:#ddd;stroke:#ddd;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#555555;stroke:#555555;}#my-svg .marker.cross{stroke:#555555;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:#060606;stroke-width:2px;opacity:0.7;}#my-svg .pieOuterCircle{stroke:#333333;stroke-width:1px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:16px;fill:#f0ebe0;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#f0ebe0;font-size:12px;}#my-svg .legend text{fill:#f0ebe0;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;}#my-svg .node .neo-node{stroke:#333333;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#333333;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><circle cx="0" cy="0" r="185.5" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,34.666,181.723L0,0Z" fill="#ff2d00" class="pieCircle"/><path d="M34.666,181.723A185,185,0,0,1,-183.541,-23.187L0,0Z" fill="#333333" class="pieCircle"/><path d="M-183.541,-23.187A185,185,0,0,1,0,-185L0,0Z" fill="#555555" class="pieCircle"/><text transform="translate(138.13422258867735,-13.057528472943849)" class="slice" style="text-anchor: middle;">47%</text><text transform="translate(-94.98091094760557,101.14439705472084)" class="slice" style="text-anchor: middle;">30%</text><text transform="translate(-91.75702131365667,-104.0779109112263)" class="slice" style="text-anchor: middle;">23%</text><text x="0" y="-200" class="pieTitleText">System Failure Breakdown</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(255, 45, 0); stroke: rgb(255, 45, 0);"/><text x="22" y="14">Authentication Failures (47% OTP drop-off)</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/><text x="22" y="14">Intent Classification Gaps (SLU at 70%)</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(85, 85, 85); stroke: rgb(85, 85, 85);"/><text x="22" y="14">Conversation Flow Dead-Ends</text></g></g></svg>