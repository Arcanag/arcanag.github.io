title: "Anurag Sharma"
description: "AI Product & Delivery Leader. Building products that replace complexity with conversation."
url: "https://arcanag.github.io"
baseurl: ""
markdown: kramdown
permalink: pretty

collections:
  case-studies:
    output: true
    permalink: /case-studies/:slug/
  frameworks:
    output: true
    permalink: /frameworks/:slug/

defaults:
  - scope:
      path: ""
      type: "case-studies"
    values:
      layout: "case-study"
  - scope:
      path: "_posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "frameworks"
    values:
      layout: "framework"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
